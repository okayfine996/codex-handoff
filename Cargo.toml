[package]
name = "codex-handoff"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ch"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = { version = "7.2", features = ["custom_styling"] }
console = "0.16"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
